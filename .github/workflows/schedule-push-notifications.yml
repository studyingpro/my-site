name: 予定のプッシュ通知を予約する

# config.json が更新されたら自動実行。
# それに加えて、取りこぼし防止のために30分おきと、手動実行にも対応。
on:
  push:
    branches: [main]
    paths:
      - "config.json"
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write # 送信予約の記録ファイルをコミットし直すために必要

jobs:
  schedule-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: OneSignalに通知を予約
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: node scripts/send-notifications.mjs

      - name: 予約状況の記録を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/data/notify-state.json
          git diff --cached --quiet || git commit -m "chore: 通知の予約状況を更新"
          git push
